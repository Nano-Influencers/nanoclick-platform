name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: NanoClick Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nanoclick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d nanoclick"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: nano-influencers-fullstack/nano-influencers-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: pip install pip-audit && pip-audit -r requirements.txt --strict
      - name: Create isolated migration and test databases
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              connection = await asyncpg.connect("postgresql://ci:ci@localhost:5432/nanoclick")
              try:
                  await connection.execute('CREATE DATABASE "nanoclick_migrations"')
                  await connection.execute('CREATE DATABASE "nanoclick_test"')
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Compile deployed backend and tests
        run: python -m compileall -q app tests
      - name: Validate application imports
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/nanoclick_test
          SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
          APP_ENV: test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
        run: python -c "import app.models; import app.main"
      - name: Validate Alembic migration graph
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/nanoclick_migrations
          SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
          APP_ENV: test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
        run: |
          set -euo pipefail
          HEADS="$(alembic heads 2>&1)"
          printf '%s\n' "$HEADS"
          HEAD_COUNT="$(printf '%s\n' "$HEADS" | grep -Ec '\(head\)$' || true)"
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "Expected exactly one Alembic head; found $HEAD_COUNT"
            exit 1
          fi
          alembic upgrade head
          alembic current
      - name: Run full deployed backend test suite
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/nanoclick_test
          SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
          APP_ENV: test
          REDIS_URL: redis://localhost:6379/0
          RESEND_API_KEY: ci-test-resend-key
          SMTP_FROM_EMAIL: no-reply@example.com
          SUPPORT_EMAIL: support@example.com
          PYTHONPATH: .
        run: pytest -q

  backend-image:
    name: NanoClick Backend Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --pull -t nanoclick-backend:ci ./nano-influencers-fullstack/nano-influencers-backend

  nano-influencers:
    name: NanoClick Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nano-influencers-fullstack/nano-influencers-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nano-influencers-fullstack/nano-influencers-frontend/package-lock.json
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - run: npm run build

  click-workers:
    name: Click Workers Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: click-workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.3"
          cache: true
      - run: flutter pub get
      - name: Verify Firebase has been fully removed
        shell: bash
        run: |
          if flutter pub deps --style=compact | grep -E '(^|[[:space:]])(firebase_|cloud_firestore|_flutterfire_internals|google_sign_in)([[:space:]]|$)'; then
            echo "Firebase/legacy Google sign-in packages remain in the resolved Flutter dependency graph."
            exit 1
          fi
      - name: Analyze Flutter sources
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Build web
        run: flutter build web --release
      - name: Build Android
        run: flutter build apk --debug
