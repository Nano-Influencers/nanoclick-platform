name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nanoclick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d nanoclick"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Validate application imports
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/nanoclick
          SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
          PYTHONPATH: .
        run: python -c "import app.models; import app.main"
      - name: Validate Alembic migration graph
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/nanoclick
          SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
          PYTHONPATH: .
        run: |
          test "$(alembic heads | grep -c '(head)')" = "1"
          alembic upgrade head
      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/nanoclick
          SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
          PYTHONPATH: .
        run: PYTHONPATH=. pytest -q

  nano-influencers:
    name: Nano Influencers Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nano-influencers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nano-influencers/package-lock.json
      - run: npm ci
      - run: npm run build

  click-workers:
    name: Click Workers Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: click-workers
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.3"
          cache: true
      - run: flutter pub get
      - name: Verify Firebase has been fully removed
        shell: bash
        run: |
          if flutter pub deps --style=compact | grep -E '(^|[[:space:]])(firebase_|cloud_firestore|_flutterfire_internals|google_sign_in)([[:space:]]|$)'; then
            echo "Firebase/legacy Google sign-in packages remain in the resolved Flutter dependency graph."
            exit 1
          fi
      - name: Analyze Flutter sources
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Build web
        run: flutter build web --release
      - name: Build Android
        run: flutter build apk --debug
