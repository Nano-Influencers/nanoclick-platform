name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Validate Alembic imports
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/nanoclick
          SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
        run: python -c "import app.models; import app.main"

  nano-influencers:
    name: Nano Influencers Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nano-influencers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nano-influencers/package-lock.json
      - run: npm ci
      - run: npm run build

  click-workers:
    name: Click Workers Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: click-workers
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.0"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release
