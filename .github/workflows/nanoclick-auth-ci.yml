name: NanoClick Authentication CI

on:
  pull_request:
    branches: [main]
    paths:
      - "nano-influencers-fullstack/nano-influencers-backend/**"
      - "nano-influencers-fullstack/nano-influencers-frontend/**"
      - ".github/workflows/nanoclick-auth-ci.yml"
  push:
    branches: [main]
    paths:
      - "nano-influencers-fullstack/nano-influencers-backend/**"
      - "nano-influencers-fullstack/nano-influencers-frontend/**"
      - ".github/workflows/nanoclick-auth-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Deployed NanoClick Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nanoclick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d nanoclick"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: nano-influencers-fullstack/nano-influencers-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Create isolated migration and test databases
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              connection = await asyncpg.connect("postgresql://ci:ci@localhost:5432/nanoclick")
              try:
                  await connection.execute('CREATE DATABASE "nanoclick_migrations"')
                  await connection.execute('CREATE DATABASE "nanoclick_test"')
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Compile deployed backend and tests
        run: python -m compileall -q app tests
      - name: Validate deployed backend imports
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/nanoclick_test
          SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
          APP_ENV: test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
        run: python -c "import app.models; import app.main"
      - name: Validate and apply deployed Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/nanoclick_migrations
          SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
          APP_ENV: test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
        run: |
          set -euo pipefail
          alembic heads
          alembic upgrade head
          alembic current
      - name: Run deployed backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/nanoclick_test
          SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
          APP_ENV: test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
        run: pytest -q

  frontend:
    name: Deployed NanoClick Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nano-influencers-fullstack/nano-influencers-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nano-influencers-fullstack/nano-influencers-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
